services:
  - type: web
    name: daypilot-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: local
      - key: GNANI_USE_MOCK
        value: false
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
